<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="styles-GC.css">
    <title>Generar Contraseña</title>
</head>
<body>
    <header>
        <div class="header">
            <img src="Captura de pantalla 2025-05-26 222016.png" alt="Logo de Henry">
            <nav class="nav">
                <ul class="nav__list">  
                    <li class="nav__item"><a href="./index.html" >Home</a></li>
                    <li class="nav__item"><a href="./GenerarContrasena.html">Generar Contraseña</a></li>
                    <li class="nav__item"><a href="./CajaFuerte.html">Caja Fuerte</a></li>
                    <li class="nav__item"><a href="./MonitoreoActividad.html">Monitoreo de Actividad</a></li>
                    <li class="nav__item"><a href="./GestionUsuarios.html">Gestion de Usuarios</a></li>
                </ul>
            </nav>
            </div> 
    </header>
    <main>
        <div class="contenedor">
            <section>
                <h1 id="Titulo">Asistente De Seguridad</h1>
            </section>
            <section id="Subtitulo">
                <h5>Generador de Contraseña para Usuarios:</h5>
            </section>
            <section class="form">
                <form id="formulario">
                    <div>
                        <label>
                        Cantidad de caracteres deseados: 
                        <input type="number" id="longitud" name="longitud" min="1" max="10" required>
                        </label>
                    </div>
                    <div>
                    <label> 
                        ¿Incluir caracteres especiales?
                        <input type="checkbox" id="caracteresEspeciales" class="checkbox-container">
                    </label>
                    </div>
                    <div>
                    <label>
                        ¿Incluir Caracteres Números?
                        <input type="checkbox" id="numeros" class="checkbox-container">
                    </label>
                    </div>
                    <div>
                    <label>
                        ¿Incluir Caracteres Mayúsculas?
                        <input type="checkbox" id="mayusculas" class="checkbox-container">
                    </label>
                    </div>
                    <div class="Button">
                    <button type="submit">Generar Contraseña</button>
                    </div>
                    <div>
                    <h4 id="resultado">Contraseña Generada: </h4>
                    <script src="GenerarContrasena.js"></script>
                </form>
            </section>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
